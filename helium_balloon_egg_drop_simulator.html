<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helium Balloon Egg Drop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Spline+Sans+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f4efe6;
    --panel: #fbf8f1;
    --ink: #2b2620;
    --ink-soft: #6f6658;
    --line: #ddd3c2;
    --accent: #d85a30;
    --accent-dark: #993c1d;
    --green: #4f7a3a;
    --blue: #3a6ea5;
    --red: #c0392b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Spline Sans Mono', monospace;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3vh 3vw;
    background-image: radial-gradient(circle at 20% 15%, rgba(216,90,48,0.05), transparent 45%),
                      radial-gradient(circle at 85% 80%, rgba(58,110,165,0.05), transparent 45%);
  }

  .wrap {
    width: 100%;
    max-width: 1180px;
    display: grid;
    grid-template-columns: 1.55fr 1fr;
    gap: clamp(16px, 2vw, 32px);
    align-items: stretch;
  }

  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 50px -24px rgba(43,38,32,0.35);
    min-height: 0;
  }

  canvas { display: block; width: 100%; height: 100%; }

  #status {
    position: absolute;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(13px, 1.4vw, 16px);
    font-weight: 500;
    padding: 9px 18px;
    background: rgba(251,248,241,0.94);
    border: 1px solid var(--line);
    border-radius: 999px;
    white-space: nowrap;
    display: none;
    box-shadow: 0 6px 18px -8px rgba(43,38,32,0.4);
  }
  .s-broken { color: var(--red); }
  .s-safe   { color: var(--green); }
  .s-floated{ color: var(--blue); }

  .side {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 1.6vw, 20px);
    min-width: 0;
  }

  .titlecard h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(22px, 2.8vw, 34px);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  .titlecard p {
    margin-top: 6px;
    color: var(--ink-soft);
    font-size: clamp(12px, 1.3vw, 14px);
  }

  .metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .metric {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .metric .lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }
  .metric .val {
    font-family: 'Fraunces', serif;
    font-size: clamp(20px, 2.4vw, 28px);
    font-weight: 600;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: clamp(14px, 1.6vw, 20px);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .ctl label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }
  .ctl label b {
    color: var(--ink);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  input[type=number] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font-family: 'Spline Sans Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type=number]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(216,90,48,0.15);
  }

  .actions { display: flex; gap: 10px; align-items: center; }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:hover { background: var(--accent-dark); }
  button:active { transform: translateY(1px); }
  .hint { font-size: 12px; color: var(--ink-soft); }

  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; }
    .stage { min-height: 52vh; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <canvas id="scene" width="760" height="560"></canvas>
      <div id="status"></div>
    </div>

    <div class="side">
      <div class="titlecard">
        <h1>Helium Balloon<br>Egg Drop</h1>
        <p>30&nbsp;g egg falling from 15&nbsp;m. Type the helium volume to slow the fall below the 2.5&nbsp;m/s break threshold.</p>
      </div>

      <div class="metrics">
        <div class="metric"><div class="lbl">Height</div><div class="val" id="hOut">15.0 m</div></div>
        <div class="metric"><div class="lbl">Velocity</div><div class="val" id="vOut">0.00 m/s</div></div>
        <div class="metric"><div class="lbl">Radius</div><div class="val" id="rMetricOut">— cm</div></div>
        <div class="metric"><div class="lbl">Terminal v</div><div class="val" id="vtOut">— m/s</div></div>
      </div>

      <div class="controls">
        <div class="ctl">
          <label for="vInput">Helium volume (L)</label>
          <input id="vInput" type="number" min="0.1" max="500" step="0.1" value="14.1">
        </div>
        <div class="ctl">
          <label for="mInput">Egg mass (g)</label>
          <input id="mInput" type="number" min="1" max="1000" step="1" value="30">
        </div>
        <div class="actions">
          <button id="restartBtn">↻ Restart drop</button>
          <span class="hint">Breaks above 2.5&nbsp;m/s impact</span>
        </div>
      </div>
    </div>
  </div>

<script>
(function() {
  const cvs = document.getElementById('scene');
  const ctx = cvs.getContext('2d');

  function fit() {
    const r = cvs.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cvs.width = Math.round(r.width * dpr);
    cvs.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout.W = r.width; layout.H = r.height;
    layout.topY = r.height * 0.07;
    layout.groundY = r.height * 0.9;
    layout.pxPerMeter = (layout.groundY - layout.topY) / 15;
  }
  const layout = {};

  const PHYS = { m_rub: 0.002, rho_a: 1.225, rho_h: 0.1786, g: 9.81, Cd: 0.47, break_v: 2.5 };
  const state = { volL: 14.1, r: 0.15, m_egg: 0.030, h: 15.0, v: 0.0, t: 0, running: true, outcome: null, impactV: 0, postT: 0 };

  // Derive initial radius from volume
  state.r = Math.cbrt((state.volL / 1000) * 0.75 / Math.PI);

  const volume = r => (4/3) * Math.PI * r*r*r;
  function termV(r, m) {
    const V = volume(r), A = Math.PI*r*r;
    const netW = PHYS.g * (m + PHYS.m_rub - (PHYS.rho_a - PHYS.rho_h) * V);
    return netW <= 0 ? null : Math.sqrt(2*netW / (PHYS.rho_a*PHYS.Cd*A));
  }

  function reset() {
    state.h = 15; state.v = 0; state.t = 0;
    state.running = true; state.outcome = null; state.impactV = 0; state.postT = 0;
    document.getElementById('status').style.display = 'none';
  }

  function step(dt) {
    if (state.running) {
      const r = state.r, V = volume(r), A = Math.PI*r*r;
      const inertia = state.m_egg + PHYS.m_rub + PHYS.rho_h*V;
      const Fg = PHYS.g * (state.m_egg + PHYS.m_rub - (PHYS.rho_a - PHYS.rho_h)*V);
      const Fd = -0.5 * PHYS.rho_a * state.v * Math.abs(state.v) * PHYS.Cd * A;
      state.v += ((Fg + Fd) / inertia) * dt;
      state.h -= state.v * dt;
      state.t += dt;
      if (state.h <= 0) {
        state.impactV = state.v; state.h = 0; state.running = false;
        state.outcome = state.v > PHYS.break_v ? 'broken' : 'safe';
        showStatus();
      } else if (state.h > 18) {
        state.running = false; state.outcome = 'floated'; showStatus();
      }
    } else { state.postT += dt; }
  }

  function showStatus() {
    const el = document.getElementById('status');
    if (state.outcome === 'broken')      el.innerHTML = '<span class="s-broken">✕ Egg broke — impact ' + state.impactV.toFixed(2) + ' m/s</span>';
    else if (state.outcome === 'safe')   el.innerHTML = '<span class="s-safe">✓ Safe landing — impact ' + state.impactV.toFixed(2) + ' m/s</span>';
    else if (state.outcome === 'floated')el.innerHTML = '<span class="s-floated">↑ Floated away</span>';
    el.style.display = 'block';
  }

  function eggSize() { const s = Math.cbrt(state.m_egg/0.030); return { rx: 9*s, ry: 13*s }; }

  function drawBalloon(cx, cy, rPx) {
    const grad = ctx.createRadialGradient(cx - rPx*0.3, cy - rPx*0.35, rPx*0.1, cx, cy, rPx);
    grad.addColorStop(0, '#ef7d54'); grad.addColorStop(1, '#d85a30');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, rPx, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#993c1d'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.ellipse(cx - rPx*0.32, cy - rPx*0.38, rPx*0.16, rPx*0.1, -0.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#993c1d';
    ctx.beginPath(); ctx.moveTo(cx-3, cy+rPx-1); ctx.lineTo(cx, cy+rPx+6); ctx.lineTo(cx+3, cy+rPx-1); ctx.closePath(); ctx.fill();
  }

  function drawEgg(cx, cy) {
    const { rx, ry } = eggSize();
    ctx.fillStyle = '#fdf6e9'; ctx.strokeStyle = '#b8a888'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.ellipse(cx - rx*0.3, cy - ry*0.3, rx*0.25, ry*0.18, -0.5, 0, Math.PI*2); ctx.fill();
  }

  function drawCracked(cx) {
    const { rx } = eggSize(); const splat = rx*4; const gY = layout.groundY;
    ctx.fillStyle = '#f5c14a';
    ctx.beginPath(); ctx.ellipse(cx, gY-4, splat, splat*0.26, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fdd870';
    ctx.beginPath(); ctx.ellipse(cx-4, gY-5, splat*0.32, splat*0.16, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fdf6e9'; ctx.strokeStyle = '#b8a888'; ctx.lineWidth = 1;
    const k = splat/30;
    [[-28,-2,6,3,0.3],[-14,-9,5,4,-0.4],[16,-8,6,3,0.6],[30,-2,5,3,-0.2],[2,-12,4,3,0],[-22,-13,4,2,0.5]]
      .forEach(p => { ctx.beginPath(); ctx.ellipse(cx+p[0]*k, gY+p[1], p[2]*k, p[3]*k, p[4], 0, Math.PI*2); ctx.fill(); ctx.stroke(); });
  }

  function render() {
    const { W, H, topY, groundY, pxPerMeter } = layout;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ece5d6'; ctx.fillRect(0, groundY, W, H-groundY);
    ctx.strokeStyle = '#cdbfa6'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    ctx.strokeStyle = '#d9cdb8'; ctx.fillStyle = '#9a8e76'; ctx.font = '12px "Spline Sans Mono", monospace'; ctx.textAlign = 'right';
    for (let m = 0; m <= 15; m++) {
      const y = groundY - m*pxPerMeter;
      ctx.beginPath(); ctx.moveTo(34, y); ctx.lineTo(44, y); ctx.stroke();
      if (m % 3 === 0) ctx.fillText(m + ' m', 32, y+4);
    }
    const cx = W/2, rPx = state.r*100*(pxPerMeter/57.6*2.6), stringLen = H*0.06;
    const { ry } = eggSize();
    if (state.outcome === 'broken') {
      drawCracked(cx);
      const yB = groundY - 12 - rPx - state.postT*2.5*pxPerMeter;
      if (yB + rPx > -10) {
        ctx.strokeStyle = '#b3a78f'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx, yB+rPx); ctx.lineTo(cx, yB+rPx+stringLen); ctx.stroke();
        drawBalloon(cx, yB, rPx);
      }
    } else {
      const h = Math.max(0, state.h);
      const yEgg = groundY - h*pxPerMeter - ry;
      const yB = yEgg - ry - stringLen - rPx;
      ctx.strokeStyle = '#b3a78f'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, yB+rPx+4); ctx.lineTo(cx, yEgg-ry+1); ctx.stroke();
      drawBalloon(cx, yB, rPx);
      drawEgg(cx, yEgg);
    }
  }

  function updateMetrics() {
    document.getElementById('hOut').textContent = Math.max(0, state.h).toFixed(1) + ' m';
    document.getElementById('vOut').textContent = state.v.toFixed(2) + ' m/s';
    document.getElementById('rMetricOut').textContent = (state.r * 100).toFixed(1) + ' cm';
    const vt = termV(state.r, state.m_egg);
    document.getElementById('vtOut').textContent = vt === null ? 'floats up' : vt.toFixed(2) + ' m/s';
  }

  let lastT = null;
  function frame(t) {
    if (lastT === null) lastT = t;
    const dt = Math.min((t-lastT)/1000, 0.05); lastT = t;
    for (let i = 0; i < 6; i++) step(dt/6);
    render(); updateMetrics();
    requestAnimationFrame(frame);
  }

  document.getElementById('vInput').addEventListener('input', e => {
    let v = parseFloat(e.target.value);
    if (isNaN(v) || v <= 0) v = 0.001; // Prevent physics engine crash on 0 or invalid input
    state.volL = v;
    state.r = Math.cbrt((state.volL / 1000) * 0.75 / Math.PI); // recalculate radius
    updateMetrics();
  });
  
  document.getElementById('mInput').addEventListener('input', e => {
    let m = parseFloat(e.target.value);
    if (isNaN(m) || m <= 0) m = 1; // Minimum 1 gram
    state.m_egg = m / 1000;
    updateMetrics();
  });
  
  document.getElementById('restartBtn').addEventListener('click', reset);
  window.addEventListener('resize', fit);

  fit(); updateMetrics(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
