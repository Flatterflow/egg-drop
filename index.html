<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helium Balloon Egg Drop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Spline+Sans+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f4efe6;
    --panel: #fbf8f1;
    --ink: #2b2620;
    --ink-soft: #6f6658;
    --line: #ddd3c2;
    --accent: #d85a30;
    --accent-dark: #993c1d;
    --green: #4f7a3a;
    --blue: #3a6ea5;
    --red: #c0392b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Spline Sans Mono', monospace;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3vh 3vw;
    background-image: radial-gradient(circle at 20% 15%, rgba(216,90,48,0.05), transparent 45%),
                      radial-gradient(circle at 85% 80%, rgba(58,110,165,0.05), transparent 45%);
  }

  .wrap {
    width: 100%;
    max-width: 1180px;
    display: grid;
    grid-template-columns: 1.55fr 1fr;
    gap: clamp(16px, 2vw, 32px);
    align-items: stretch;
  }

  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 50px -24px rgba(43,38,32,0.35);
    min-height: 0;
  }

  canvas { display: block; width: 100%; height: 100%; }

  #status {
    position: absolute;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(13px, 1.4vw, 16px);
    font-weight: 500;
    padding: 9px 18px;
    background: rgba(251,248,241,0.94);
    border: 1px solid var(--line);
    border-radius: 999px;
    white-space: nowrap;
    display: none;
    box-shadow: 0 6px 18px -8px rgba(43,38,32,0.4);
  }
  .s-broken { color: var(--red); }
  .s-safe   { color: var(--green); }
  .s-floated{ color: var(--blue); }

  .side {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 1.6vw, 20px);
    min-width: 0;
  }

  .titlecard h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(22px, 2.8vw, 34px);
    line-height: 1.05;
    letter-spacing: -0.01em;
  }
  .titlecard p {
    margin-top: 6px;
    color: var(--ink-soft);
    font-size: clamp(12px, 1.3vw, 14px);
  }

  .metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .metric {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .metric .lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }
  .metric .val {
    font-family: 'Fraunces', serif;
    font-size: clamp(20px, 2.4vw, 28px);
    font-weight: 600;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: clamp(14px, 1.6vw, 20px);
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .ctl label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }
  .ctl label b {
    color: var(--ink);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  input[type=number] {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font-family: 'Spline Sans Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type=number]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(216,90,48,0.15);
  }

  .actions { display: flex; gap: 10px; align-items: center; }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:hover { background: var(--accent-dark); }
  button:active { transform: translateY(1px); }
  .hint { font-size: 12px; color: var(--ink-soft); }

  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; }
    .stage { min-height: 52vh; }
  }
<style>
.stat { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.65rem 0.85rem; }
.stat-label { font-size: 12px; color: var(--color-text-secondary); margin: 0; }
.stat-value { font-size: 18px; font-weight: 500; margin: 2px 0 0; color: var(--color-text-primary); font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 12px; margin: 1rem 0 0; }
.s-broken { color: var(--color-text-danger); font-weight: 500; }
.s-safe { color: var(--color-text-success); font-weight: 500; }
.s-floated { color: var(--color-text-info); font-weight: 500; }
.control-input { flex: 1; padding: 6px; border: 1px solid var(--color-border-secondary); border-radius: 4px; font-family: inherit; font-size: 14px; }
.btn { padding: 8px 16px; border-radius: 4px; font-size: 14px; cursor: pointer; font-family: inherit; border: none; font-weight: 500; }
.btn-primary { background: #3a6ea5; color: white; }
.btn-secondary { background: var(--color-background-secondary); border: 1px solid var(--color-border-secondary); color: var(--color-text-primary); }
</style>

<h2 class="sr-only">Interactive simulation of a helium balloon dropping an adjustable-mass egg.</h2>

<div style="position: relative; width: 100%; height: 400px; background: var(--color-background-secondary); border-radius: var(--border-radius-md); overflow: hidden;">
  <canvas id="scene" width="680" height="400" style="display: block; width: 100%; height: 100%;"></canvas>
  <div id="status" style="position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 13px; padding: 6px 12px; background: var(--color-background-primary); border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); display: none; white-space: nowrap;"></div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 1rem 0 0;">
  <div class="stat"><p class="stat-label">Height</p><p class="stat-value" id="hOut">5.8 m</p></div>
  <div class="stat"><p class="stat-label">Velocity</p><p class="stat-value" id="vOut">0.00 m/s</p></div>
  <div class="stat"><p class="stat-label">Time</p><p class="stat-value" id="tOut">0.0 s</p></div>
  <div class="stat"><p class="stat-label">He volume</p><p class="stat-value" id="volOut">— L</p></div>
  <div class="stat"><p class="stat-label">Terminal v</p><p class="stat-value" id="vtOut">— m/s</p></div>
</div>

<div class="row">
  <label for="heightSel" style="font-size: 14px; color: var(--color-text-secondary); min-width: 130px;">Drop Height</label>
  <select id="heightSel" class="control-input">
    <option value="5.8">5.8 m</option>
    <option value="3.7">3.7 m</option>
  </select>
</div>

<div class="row" style="margin-top: 0.6rem;">
  <label for="purityIn" style="font-size: 14px; color: var(--color-text-secondary); min-width: 130px;">He Purity (%)</label>
  <input id="purityIn" type="number" min="0" max="100" step="1" value="100" class="control-input" />
</div>

<div class="row" style="margin-top: 0.6rem;">
  <label for="breakIn" style="font-size: 14px; color: var(--color-text-secondary); min-width: 130px;">Impact Tol. (m/s)</label>
  <input id="breakIn" type="number" min="0.5" max="10" step="0.1" value="2.5" class="control-input" />
</div>

<div class="row" style="margin-top: 0.6rem;">
  <label for="rSlider" style="font-size: 14px; color: var(--color-text-secondary); min-width: 130px;">Balloon radius</label>
  <input id="rSlider" type="range" min="5" max="40" step="0.5" value="15" style="flex: 1;" />
  <span id="rOut" style="font-size: 14px; font-weight: 500; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums;">15.0 cm</span>
</div>

<div class="row" style="margin-top: 0.6rem;">
  <label for="mSlider" style="font-size: 14px; color: var(--color-text-secondary); min-width: 130px;">Egg mass</label>
  <input id="mSlider" type="range" min="5" max="100" step="1" value="30" style="flex: 1;" />
  <span id="mOut" style="font-size: 14px; font-weight: 500; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums;">30 g</span>
</div>

<div class="row" style="justify-content: space-between; border-top: 1px solid var(--color-border-tertiary); padding-top: 1rem; margin-top: 1rem;">
  <span id="breakHint" style="font-size: 13px; color: var(--color-text-secondary);">Breaks above 2.5 m/s impact</span>
  <div style="display: flex; gap: 8px;">
    <button id="restartBtn" class="btn btn-secondary"><i class="ti ti-refresh" aria-hidden="true" style="margin-right: 4px;"></i>Reset</button>
    <button id="dropBtn" class="btn btn-primary"><i class="ti ti-arrow-down" aria-hidden="true" style="margin-right: 4px;"></i>Drop Simulation</button>
  </div>
</div>

<script>
(function() {
  const cvs = document.getElementById('scene');
  const ctx = cvs.getContext('2d');
  const W = 680, H = 400;
  const topY = 30, groundY = 370;
  // Adjusted scale so 7 meters fits perfectly on the canvas
  const pxPerMeter = (groundY - topY) / 7;

  const PHYS = {
    m_rub: 0.002,
    rho_a: 1.225, rho_h: 0.1786,
    g: 9.81, Cd: 0.55 // Updated to Bluff-body Teardrop Drag
  };

  const state = {
    r: 0.15, m_egg: 0.030,
    purity: 1.0, break_v: 2.5, start_h: 5.8,
    h: 5.8, v: 0.0, t: 0,
    running: false, outcome: null, impactV: 0, postT: 0
  };

  function volume(r) { return (4/3) * Math.PI * r*r*r; }
  
  function getGasDensity() {
    return state.purity * PHYS.rho_h + (1 - state.purity) * PHYS.rho_a;
  }

  function termV(r, m_egg) {
    const V = volume(r);
    const A = Math.PI * r*r;
    const rho_gas = getGasDensity();
    const netW = PHYS.g * (m_egg + PHYS.m_rub - (PHYS.rho_a - rho_gas) * V);
    if (netW <= 0) return null;
    return Math.sqrt(2 * netW / (PHYS.rho_a * PHYS.Cd * A));
  }

  function reset() {
    state.h = state.start_h; state.v = 0; state.t = 0;
    state.running = false; state.outcome = null;
    state.impactV = 0; state.postT = 0;
    document.getElementById('status').style.display = 'none';
    updateMetrics();
    render();
  }

  function start() {
    if (!state.running && state.outcome === null) {
      state.running = true;
    }
  }

  function step(dt) {
    if (state.running) {
      const r = state.r;
      const V = volume(r);
      const A = Math.PI * r*r;
      const rho_gas = getGasDensity();
      
      const inertia = state.m_egg + PHYS.m_rub + rho_gas * V;
      const Fg = PHYS.g * (state.m_egg + PHYS.m_rub - (PHYS.rho_a - rho_gas) * V);
      const Fd = -0.5 * PHYS.rho_a * state.v * Math.abs(state.v) * PHYS.Cd * A;
      
      const a = (Fg + Fd) / inertia;
      state.v += a * dt;
      state.h -= state.v * dt;
      state.t += dt;
      
      if (state.h <= 0) {
        state.impactV = state.v;
        state.h = 0;
        state.running = false;
        state.outcome = state.v > state.break_v ? 'broken' : 'safe';
        showStatus();
      } else if (state.h > state.start_h + 3) { // floated off screen
        state.running = false;
        state.outcome = 'floated';
        showStatus();
      }
    } else if (state.outcome) {
      state.postT += dt;
    }
  }

  function showStatus() {
    const el = document.getElementById('status');
    if (state.outcome === 'broken') {
      el.innerHTML = '<span class="s-broken"><i class="ti ti-alert-triangle" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"></i>Egg broke — impact ' + state.impactV.toFixed(2) + ' m/s</span>';
    } else if (state.outcome === 'safe') {
      el.innerHTML = '<span class="s-safe"><i class="ti ti-check" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"></i>Safe landing — impact ' + state.impactV.toFixed(2) + ' m/s</span>';
    } else if (state.outcome === 'floated') {
      el.innerHTML = '<span class="s-floated"><i class="ti ti-arrow-up" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"></i>Floated away</span>';
    }
    el.style.display = 'block';
  }

  function cssVar(n, fallback) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    return v || fallback;
  }

  function eggSize() {
    const s = Math.cbrt(state.m_egg / 0.030);
    return { rx: 7 * s, ry: 10 * s };
  }

  function drawBalloon(cx, cy, rPx) {
    ctx.fillStyle = '#d85a30';
    ctx.beginPath();
    ctx.arc(cx, cy, rPx, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#993c1d';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    // Teardrop tail knot
    ctx.fillStyle = '#993c1d';
    ctx.beginPath();
    ctx.moveTo(cx - 3, cy + rPx - 1);
    ctx.lineTo(cx, cy + rPx + 5);
    ctx.lineTo(cx + 3, cy + rPx - 1);
    ctx.closePath();
    ctx.fill();
  }

  function drawEgg(cx, cy) {
    const { rx, ry } = eggSize();
    ctx.fillStyle = '#fdf6e9';
    ctx.strokeStyle = '#b8a888';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
  }

  function drawCrackedEgg(cx) {
    const { rx } = eggSize();
    const splat = rx * 4;
    ctx.fillStyle = '#f5c14a';
    ctx.beginPath();
    ctx.ellipse(cx, groundY - 3, splat, splat * 0.25, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fdd870';
    ctx.beginPath();
    ctx.ellipse(cx - 3, groundY - 4, splat * 0.3, splat * 0.15, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fdf6e9';
    ctx.strokeStyle = '#b8a888';
    ctx.lineWidth = 1;
    const k = splat / 28;
    const pieces = [[-28,-2,6,3,0.3],[-14,-9,5,4,-0.4],[16,-8,6,3,0.6],[30,-2,5,3,-0.2],[2,-11,4,3,0],[-22,-12,4,2,0.5]];
    pieces.forEach(p => {
      ctx.beginPath();
      ctx.ellipse(cx + p[0]*k, groundY + p[1], p[2]*k, p[3]*k, p[4], 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();
    });
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = cssVar('--color-background-tertiary', '#e8e6dc');
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = cssVar('--color-border-secondary', '#bbb');
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();

    ctx.strokeStyle = cssVar('--color-border-tertiary', '#ccc');
    ctx.fillStyle = cssVar('--color-text-tertiary', '#888');
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'right';
    
    // Draw background scale lines up to 7m
    for (let m = 0; m <= 7; m++) {
      const y = groundY - m * pxPerMeter;
      ctx.beginPath();
      ctx.moveTo(28, y); ctx.lineTo(36, y); ctx.stroke();
      ctx.fillText(m + ' m', 26, y + 4);
    }

    const cx = W / 2;
    const rPx = state.r * 100 * (pxPerMeter / 100) * 2.6; // Scale visually
    const stringLen = 28;
    const { ry } = eggSize();

    if (state.outcome === 'broken') {
      drawCrackedEgg(cx);
      const riseV = 2.5;
      const yB = groundY - 10 - rPx - state.postT * riseV * pxPerMeter;
      if (yB + rPx > -10) {
        ctx.strokeStyle = cssVar('--color-text-tertiary', '#999');
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(cx, yB + rPx);
        ctx.lineTo(cx, yB + rPx + 24);
        ctx.stroke();
        drawBalloon(cx, yB, rPx);
      }
    } else {
      const h = Math.max(0, state.h);
      const yEgg = groundY - h * pxPerMeter - ry;
      const yB = yEgg - ry - stringLen - rPx;
      ctx.strokeStyle = cssVar('--color-text-tertiary', '#999');
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(cx, yB + rPx + 4);
      ctx.lineTo(cx, yEgg - ry + 1);
      ctx.stroke();
      drawBalloon(cx, yB, rPx);
      drawEgg(cx, yEgg);
    }
  }

  function updateMetrics() {
    document.getElementById('hOut').textContent = Math.max(0, state.h).toFixed(1) + ' m';
    document.getElementById('vOut').textContent = state.v.toFixed(2) + ' m/s';
    document.getElementById('tOut').textContent = state.t.toFixed(1) + ' s';
    const V_L = volume(state.r) * 1000;
    document.getElementById('volOut').textContent = V_L.toFixed(2) + ' L';
    const vt = termV(state.r, state.m_egg);
    document.getElementById('vtOut').textContent = vt === null ? 'floats up' : vt.toFixed(2) + ' m/s';
  }

  let lastT = null;
  function frame(t) {
    if (lastT === null) lastT = t;
    let dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    const N = 6;
    for (let i = 0; i < N; i++) step(dt / N);
    render();
    if(state.running || state.outcome !== null) updateMetrics();
    requestAnimationFrame(frame);
  }

  // --- Event Listeners ---
  document.getElementById('rSlider').addEventListener('input', (e) => {
    state.r = parseFloat(e.target.value) / 100;
    document.getElementById('rOut').textContent = (state.r * 100).toFixed(1) + ' cm';
    if (!state.running) { updateMetrics(); render(); }
  });
  
  document.getElementById('mSlider').addEventListener('input', (e) => {
    state.m_egg = parseFloat(e.target.value) / 1000;
    document.getElementById('mOut').textContent = Math.round(e.target.value) + ' g';
    if (!state.running) { updateMetrics(); render(); }
  });

  document.getElementById('heightSel').addEventListener('change', (e) => {
    state.start_h = parseFloat(e.target.value);
    reset();
  });

  document.getElementById('purityIn').addEventListener('input', (e) => {
    let val = parseFloat(e.target.value);
    if (isNaN(val)) return;
    state.purity = Math.max(0, Math.min(100, val)) / 100;
    if (!state.running) { updateMetrics(); render(); }
  });

  document.getElementById('breakIn').addEventListener('input', (e) => {
    let val = parseFloat(e.target.value);
    if (isNaN(val)) return;
    state.break_v = Math.max(0.1, val);
    document.getElementById('breakHint').textContent = `Breaks above ${state.break_v.toFixed(1)} m/s impact`;
  });

  document.getElementById('restartBtn').addEventListener('click', reset);
  document.getElementById('dropBtn').addEventListener('click', start);

  updateMetrics();
  render();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
