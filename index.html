<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helium Balloon Egg Drop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@600&family=Spline+Sans+Mono:wght@400;500&display=swap');
 
  :root {
    --bg: #f4efe6;
    --panel: #fbf8f1;
    --ink: #2b2620;
    --ink-soft: #6f6658;
    --line: #ddd3c2;
    --accent: #d85a30;
    --accent-dark: #993c1d;
    --green: #4f7a3a;
    --blue: #3a6ea5;
    --red: #c0392b;
  }
 
  * { box-sizing: border-box; margin: 0; padding: 0; }
 
  html { background: var(--bg); }
 
  body {
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Spline Sans Mono', 'Noto Sans JP', monospace;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 3vh 3vw 6vh;
    background-image: radial-gradient(circle at 20% 15%, rgba(216,90,48,0.05), transparent 45%),
                      radial-gradient(circle at 85% 80%, rgba(58,110,165,0.05), transparent 45%);
  }
 
  .lang-toggle {
    position: fixed;
    top: 18px; right: 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    display: flex;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(43,38,32,0.08);
    z-index: 100;
  }
  .lang-toggle button {
    background: transparent; color: var(--ink-soft);
    border: none; padding: 6px 14px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    border-radius: 0; transition: all 0.2s;
  }
  .lang-toggle button.active { background: var(--accent); color: #fff; }
 
  .wrap {
    width: 100%;
    max-width: 1320px;
    display: grid;
    grid-template-columns: 1.35fr 1fr 1fr;
    gap: clamp(14px, 1.6vw, 26px);
    align-items: start;
  }
 
  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 50px -24px rgba(43,38,32,0.35);
    height: min(78vh, 640px);
  }
  canvas { display: block; width: 100%; height: 100%; }
 
  #status {
    position: absolute;
    top: 16px; left: 50%;
    transform: translateX(-50%);
    font-size: 14px; font-weight: 500;
    padding: 9px 18px;
    background: rgba(251,248,241,0.94);
    border: 1px solid var(--line);
    border-radius: 999px;
    white-space: nowrap; display: none;
    box-shadow: 0 6px 18px -8px rgba(43,38,32,0.4);
  }
  .s-broken { color: var(--red); }
  .s-safe   { color: var(--green); }
  .s-floated{ color: var(--blue); }
 
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
 
  h1 {
    font-family: 'Fraunces', 'Noto Serif JP', serif;
    font-weight: 600;
    font-size: clamp(21px, 2.2vw, 30px);
    line-height: 1.15; letter-spacing: -0.01em;
  }
 
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .card h2 {
    font-size: 11px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
 
  .row {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 10px; padding: 5px 0;
    border-bottom: 1px dotted var(--line);
    font-size: 13px;
  }
  .row:last-child { border-bottom: none; padding-bottom: 0; }
  .row .k { color: var(--ink-soft); }
  .row .v { font-variant-numeric: tabular-nums; font-weight: 500; text-align: right; white-space: nowrap; }
  .row.big .v { font-family: 'Fraunces','Noto Serif JP',serif; font-size: 20px; font-weight: 600; }
  .up   { color: var(--blue); }
  .down { color: var(--accent-dark); }
  .ok   { color: var(--green); }
  .bad  { color: var(--red); }
 
  .ctl + .ctl, .ctl-group + .ctl, .ctl + .ctl-group, .ctl-group + .ctl-group { margin-top: 12px; }
  .ctl-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ctl label {
    display: flex; justify-content: space-between; gap: 6px;
    font-size: 12px; color: var(--ink-soft); margin-bottom: 5px;
  }
  .ctl label b { color: var(--ink); font-weight: 500; }
  .ctl input[type=number], .ctl select {
    width: 100%; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: 8px;
    font-family: inherit; font-size: 14px;
    background: #fff; color: var(--ink); outline: none;
    transition: border-color 0.2s;
  }
  .ctl input:focus-visible, .ctl select:focus-visible,
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ctl input[type=number]:focus, .ctl select:focus { border-color: var(--accent); }
  .ctl input:disabled { background: #f1ece2; color: var(--ink-soft); }
 
  .ctl input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 999px;
    background: var(--line); outline: none; border: none;
    padding: 0; margin-top: 4px;
  }
  .ctl input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: var(--accent);
    border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--accent);
    cursor: pointer;
  }
  .ctl input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--accent); border: 3px solid var(--panel); cursor: pointer;
  }
  .ctl input[type=range]:disabled::-webkit-slider-thumb { background: var(--ink-soft); box-shadow: 0 0 0 1px var(--ink-soft); }
 
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button {
    flex: 1; font-size: 12px; padding: 7px 8px;
    background: transparent; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
 
  .bar-track {
    height: 8px; background: var(--line);
    border-radius: 999px; overflow: hidden; margin-top: 10px;
  }
  .bar-fill { height: 100%; width: 0; background: var(--green); transition: width 0.25s ease, background 0.25s ease; }
 
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  button {
    font-family: inherit; font-size: 14px; font-weight: 500;
    color: #fff; background: var(--accent);
    border: none; border-radius: 10px; padding: 11px 20px;
    cursor: pointer; transition: background 0.15s ease, transform 0.05s ease;
  }
  button:hover { background: var(--accent-dark); }
  button:active { transform: translateY(1px); }
  button.btn-sec { background: var(--line); color: var(--ink); }
  button.btn-sec:hover { background: #d0c4ae; }
  .actions button { flex: 1; }
 
  .note { font-size: 11px; line-height: 1.5; color: var(--ink-soft); margin-top: 10px; }
 
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media (max-width: 1100px) {
    .wrap { grid-template-columns: 1fr 1fr; }
    .stage { grid-column: 1 / -1; height: 60vh; }
  }
  @media (max-width: 700px) {
    .wrap { grid-template-columns: 1fr; }
    .stage { height: 52vh; }
  }
</style>
</head>
<body>
 
  <div class="lang-toggle">
    <button id="btnEn" class="active">EN</button>
    <button id="btnJa">日本語</button>
  </div>
 
  <div class="wrap">
 
    <div class="stage">
      <canvas id="scene" width="760" height="560"></canvas>
      <div id="status"></div>
    </div>
 
    <!-- INPUTS -->
    <div class="col">
      <h1 data-i18n="title">Helium Balloon<br>Egg Drop</h1>
 
      <div class="card">
        <h2 data-i18n="h_rig">Rig</h2>
 
        <div class="tabs">
          <button id="tabMass" class="active" data-i18n="tab_mass">From weighing</button>
          <button id="tabVol" data-i18n="tab_vol">Set volume</button>
        </div>
 
        <div class="ctl-group">
          <div class="ctl">
            <label for="dryIn"><span data-i18n="lbl_dry">Dry mass (g)</span></label>
            <input id="dryIn" type="number" min="1" max="500" step="0.1" value="30">
          </div>
          <div class="ctl">
            <label for="finalIn"><span data-i18n="lbl_final">Final mass (g)</span></label>
            <input id="finalIn" type="number" min="0" max="500" step="0.1" value="15.1">
          </div>
        </div>
 
        <div class="ctl">
          <label for="volSlider">
            <span data-i18n="lbl_vol">Helium volume</span>
            <b id="volOutVal">14.1 L</b>
          </label>
          <input id="volSlider" type="range" min="1" max="120" step="0.1" value="14.1">
        </div>
 
        <div class="ctl">
          <label for="purityIn"><span data-i18n="lbl_pur">Helium purity (%)</span></label>
          <input id="purityIn" type="number" min="1" max="100" step="1" value="100">
        </div>
 
        <p class="note" data-i18n="note_mass"></p>
      </div>
 
      <div class="card">
        <h2 data-i18n="h_drop">Drop</h2>
        <div class="ctl-group">
          <div class="ctl">
            <label for="heightSel"><span data-i18n="lbl_sel_h">Height (m)</span></label>
            <select id="heightSel">
              <option value="5.8">5.8</option>
              <option value="3.7">3.7</option>
            </select>
          </div>
          <div class="ctl">
            <label for="strengthIn"><span data-i18n="lbl_str">Egg strength (N)</span></label>
            <input id="strengthIn" type="number" min="1" max="200" step="1" value="40">
          </div>
        </div>
        <div class="ctl-group">
          <div class="ctl">
            <label for="surfSel"><span data-i18n="lbl_surf">Landing surface</span></label>
            <select id="surfSel"></select>
          </div>
          <div class="ctl">
            <label for="stopIn"><span data-i18n="lbl_stop">Crush depth (mm)</span></label>
            <input id="stopIn" type="number" min="0.2" max="200" step="0.1" value="1.5">
          </div>
        </div>
 
        <div class="actions">
          <button id="dropBtn" data-i18n="btn_drop">↓ Drop</button>
          <button id="restartBtn" class="btn-sec" data-i18n="btn_reset">↻ Reset</button>
        </div>
      </div>
    </div>
 
    <!-- OUTPUTS -->
    <div class="col">
      <div class="card">
        <h2 data-i18n="h_forces">Force balance</h2>
        <div class="row"><span class="k up" data-i18n="lbl_buoy">Buoyancy ↑</span><span class="v up" id="buoyOut">—</span></div>
        <div class="row"><span class="k down" data-i18n="lbl_wt">Weight ↓</span><span class="v down" id="wtOut">—</span></div>
        <div class="row"><span class="k" data-i18n="lbl_lift">Net lift</span><span class="v" id="liftOut">—</span></div>
        <div class="row big"><span class="k" data-i18n="lbl_net">Net downward force</span><span class="v" id="netOut">—</span></div>
        <div class="row"><span class="k" data-i18n="lbl_mhe">Helium mass</span><span class="v" id="mheOut">—</span></div>
        <div class="row"><span class="k" data-i18n="lbl_mtrue">True total mass</span><span class="v" id="mtrueOut">—</span></div>
      </div>
 
      <div class="card">
        <h2 data-i18n="h_flight">Flight</h2>
        <div class="row"><span class="k" data-i18n="lbl_r">Balloon radius</span><span class="v" id="rOut">—</span></div>
        <div class="row"><span class="k" data-i18n="lbl_vt">Terminal velocity</span><span class="v" id="vtOut">—</span></div>
        <div class="row"><span class="k" data-i18n="lbl_h">Height</span><span class="v" id="hOut">—</span></div>
        <div class="row"><span class="k" data-i18n="lbl_v">Velocity</span><span class="v" id="vOut">—</span></div>
      </div>
 
      <div class="card">
        <h2 data-i18n="h_impact">Impact</h2>
        <div class="row big"><span class="k" data-i18n="lbl_iv">Impact velocity</span><span class="v" id="ivOut">—</span></div>
        <div class="row big"><span class="k" data-i18n="lbl_if">Impact force</span><span class="v" id="ifOut">—</span></div>
        <div class="row"><span class="k" data-i18n="lbl_str2">Egg strength</span><span class="v" id="strOut">—</span></div>
        <div class="row"><span class="k" data-i18n="lbl_load">Load on egg</span><span class="v" id="loadOut">—</span></div>
        <div class="bar-track"><div class="bar-fill" id="loadBar"></div></div>
        <div class="row" style="margin-top:8px"><span class="k" data-i18n="lbl_vmax">Max safe velocity</span><span class="v" id="vmaxOut">—</span></div>
        <p class="note" data-i18n="note_impact"></p>
      </div>
    </div>
 
  </div>
 
<script>
(function() {
 
  // ---------- Surfaces: effective crush depth in metres ----------
  const SURFACES = {
    concrete: { d: 0.0015, col: '#c4c0b8', spec: '#a9a49b', en: 'Concrete',   ja: 'コンクリート' },
    asphalt:  { d: 0.0025, col: '#8d8984', spec: '#6f6b66', en: 'Asphalt',    ja: 'アスファルト' },
    wood:     { d: 0.0040, col: '#c2a479', spec: '#a5875c', en: 'Wood deck',  ja: '木のデッキ' },
    soil:     { d: 0.0100, col: '#a08b6c', spec: '#84714f', en: 'Packed soil',ja: '固い土' },
    grass:    { d: 0.0150, col: '#7d9c5a', spec: '#628043', en: 'Grass',      ja: '芝生' },
    sand:     { d: 0.0300, col: '#dcc9a0', spec: '#c2ac7d', en: 'Sand',       ja: '砂' },
    foam:     { d: 0.0500, col: '#7f9bb5', spec: '#63819c', en: 'Foam mat',   ja: 'マット' }
  };
 
  const i18n = {
    en: {
      title: "Helium Balloon<br>Egg Drop",
      h_rig: "Rig", h_drop: "Drop",
      h_forces: "Force balance", h_flight: "Flight", h_impact: "Impact",
      tab_mass: "From weighing", tab_vol: "Set volume",
      lbl_dry: "Dry mass (g)", lbl_final: "Final mass (g)",
      lbl_vol: "Helium volume", lbl_pur: "Helium purity (%)",
      lbl_sel_h: "Height (m)", lbl_str: "Egg strength (N)",
      lbl_surf: "Landing surface", lbl_stop: "Crush depth (mm)",
      btn_drop: "↓ Drop", btn_reset: "↻ Reset",
      lbl_buoy: "Buoyancy ↑", lbl_wt: "Weight ↓", lbl_lift: "Net lift",
      lbl_net: "Net downward force", lbl_mhe: "Helium mass", lbl_mtrue: "True total mass",
      lbl_r: "Balloon radius", lbl_vt: "Terminal velocity", lbl_h: "Height", lbl_v: "Velocity",
      lbl_iv: "Impact velocity", lbl_if: "Impact force", lbl_str2: "Egg strength",
      lbl_load: "Load on egg", lbl_vmax: "Max safe velocity",
      note_mass: "Weigh the egg and empty balloon first, then weigh the whole rig again with the balloon inflated. The balloon lifts, so the second reading is lower — that drop gives the helium volume.",
      note_impact: "Impact force is the average force over the crush depth. Crush depth is an estimate — measure your own drops and tune it.",
      s_broken: "✕ Egg broke — {f} N on impact",
      s_safe: "✓ Egg survived — {f} N on impact",
      s_float: "↑ Floated away",
      float_up: "floats up", none: "—",
      warn_vol: "Final mass must be below dry mass."
    },
    ja: {
      title: "ヘリウム風船<br>エッグドロップ",
      h_rig: "装置", h_drop: "落下",
      h_forces: "力のつり合い", h_flight: "飛行", h_impact: "衝突",
      tab_mass: "測定から", tab_vol: "体積を入力",
      lbl_dry: "空の質量 (g)", lbl_final: "最終質量 (g)",
      lbl_vol: "ヘリウム体積", lbl_pur: "ヘリウム純度 (%)",
      lbl_sel_h: "落下高度 (m)", lbl_str: "卵の強度 (N)",
      lbl_surf: "着地面", lbl_stop: "つぶれる深さ (mm)",
      btn_drop: "↓ 落下", btn_reset: "↻ リセット",
      lbl_buoy: "浮力 ↑", lbl_wt: "重力 ↓", lbl_lift: "正味の揚力",
      lbl_net: "正味の下向きの力", lbl_mhe: "ヘリウムの質量", lbl_mtrue: "実際の総質量",
      lbl_r: "風船の半径", lbl_vt: "終端速度", lbl_h: "高さ", lbl_v: "速度",
      lbl_iv: "衝突速度", lbl_if: "衝撃力", lbl_str2: "卵の強度",
      lbl_load: "卵にかかる荷重", lbl_vmax: "安全な最大速度",
      note_mass: "まず卵と空の風船を測ります。次にヘリウムを入れた状態で全体をもう一度測ります。風船が浮くので2回目は軽くなり、その差からヘリウムの体積が分かります。",
      note_impact: "衝撃力はつぶれる深さの間の平均の力です。深さは目安なので、実際の落下を測って調整してください。",
      s_broken: "✕ 卵が割れました — 衝撃 {f} N",
      s_safe: "✓ 卵は無事です — 衝撃 {f} N",
      s_float: "↑ 飛んでいきました",
      float_up: "浮上", none: "—",
      warn_vol: "最終質量は空の質量より小さくしてください。"
    }
  };
  let lang = 'en';
  const T = k => i18n[lang][k];
 
  // ---------- Physics constants ----------
  const PHYS = {
    rho_a: 1.225,     // air density, 20 °C sea level  [kg/m^3]
    rho_h: 0.1664,    // helium, 20 °C                 [kg/m^3]
    g: 9.81,
    Cd: 0.50,         // sphere at Re ~5e4, bumped up for a wobbling balloon
    k_added: 0.5      // added-mass coefficient for a sphere
  };
 
  const state = {
    mode: 'mass',      // 'mass' = derive volume from weighing, 'vol' = set volume directly
    m_dry: 0.030,      // egg + deflated balloon + string   [kg]
    m_final: 0.0151,   // scale reading with balloon inflated & attached [kg]
    volManual: 14.1,   // [L]
    purity: 1.0,
    F_fail: 40,        // [N]
    d_stop: 0.0015,    // [m]
    surface: 'concrete',
    start_h: 5.8,
    h: 5.8, v: 0, t: 0,
    running: false, outcome: null, impactV: 0, impactF: 0, postT: 0
  };
 
  // ---------- Derived quantities ----------
  const rhoGas = () => state.purity * PHYS.rho_h + (1 - state.purity) * PHYS.rho_a;
 
  function volL() {                                   // helium volume in litres
    if (state.mode === 'vol') return state.volManual;
    const dRho = PHYS.rho_a - rhoGas();               // lift per unit volume
    if (dRho <= 1e-6) return 0;
    return Math.max(0, ((state.m_dry - state.m_final) / dRho) * 1000);
  }
  const volM3    = () => volL() / 1000;
  const radius   = () => Math.cbrt(3 * volM3() / (4 * Math.PI));
  const area     = () => Math.PI * radius() ** 2;
  const massHe   = () => rhoGas() * volM3();
  const massTrue = () => state.m_dry + massHe();
  const buoyancy = () => PHYS.rho_a * volM3() * PHYS.g;
  const weight   = () => massTrue() * PHYS.g;
  const netLift  = () => buoyancy() - weight();       // + = up
  const netDown  = () => weight() - buoyancy();       // + = down
  const inertia  = () => massTrue() + PHYS.k_added * PHYS.rho_a * volM3();
 
  function termV() {
    const N = netDown();
    if (N <= 0) return null;
    return Math.sqrt(2 * N / (PHYS.rho_a * PHYS.Cd * area()));
  }
  const impactF  = v => massTrue() * v * v / (2 * state.d_stop) + netDown();
  function maxSafeV() {
    const num = 2 * state.d_stop * (state.F_fail - netDown());
    return num <= 0 ? 0 : Math.sqrt(num / massTrue());
  }
 
  // ---------- Canvas ----------
  const cvs = document.getElementById('scene');
  const ctx = cvs.getContext('2d');
  const layout = {};
 
  function fit() {
    const r = cvs.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cvs.width = Math.round(r.width * dpr);
    cvs.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout.W = r.width; layout.H = r.height;
    layout.topY = r.height * 0.07;
    layout.groundY = r.height * 0.9;
    layout.pxPerMeter = (layout.groundY - layout.topY) / 7;
  }
 
  // ---------- Simulation ----------
  function reset() {
    state.h = state.start_h; state.v = 0; state.t = 0;
    state.running = false; state.outcome = null;
    state.impactV = 0; state.impactF = 0; state.postT = 0;
    document.getElementById('status').style.display = 'none';
    refresh();
  }
 
  function step(dt) {
    if (state.running) {
      const Fd = -0.5 * PHYS.rho_a * state.v * Math.abs(state.v) * PHYS.Cd * area();
      state.v += ((netDown() + Fd) / inertia()) * dt;
      state.h -= state.v * dt;
      state.t += dt;
 
      if (state.h <= 0) {
        state.h = 0; state.running = false;
        state.impactV = state.v;
        state.impactF = impactF(state.v);
        state.outcome = state.impactF > state.F_fail ? 'broken' : 'safe';
        showStatus();
      } else if (state.h > state.start_h + 3) {
        state.running = false; state.outcome = 'floated'; showStatus();
      }
    } else if (state.outcome) {
      state.postT += dt;
    }
  }
 
  function showStatus() {
    const el = document.getElementById('status');
    let msg = '';
    if (state.outcome === 'broken')
      msg = `<span class="s-broken">${T('s_broken').replace('{f}', state.impactF.toFixed(1))}</span>`;
    else if (state.outcome === 'safe')
      msg = `<span class="s-safe">${T('s_safe').replace('{f}', state.impactF.toFixed(1))}</span>`;
    else if (state.outcome === 'floated')
      msg = `<span class="s-floated">${T('s_float')}</span>`;
    el.innerHTML = msg;
    el.style.display = 'block';
  }
 
  // ---------- Drawing ----------
  const eggSize = () => { const s = Math.cbrt(state.m_dry / 0.030); return { rx: 9 * s, ry: 13 * s }; };
 
  function drawBalloon(cx, cy, rPx) {
    const grad = ctx.createRadialGradient(cx - rPx*0.3, cy - rPx*0.35, rPx*0.1, cx, cy, rPx);
    grad.addColorStop(0, '#ef7d54'); grad.addColorStop(1, '#d85a30');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, rPx, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#993c1d'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.ellipse(cx - rPx*0.32, cy - rPx*0.38, rPx*0.16, rPx*0.1, -0.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#993c1d';
    ctx.beginPath(); ctx.moveTo(cx-3, cy+rPx-1); ctx.lineTo(cx, cy+rPx+6); ctx.lineTo(cx+3, cy+rPx-1); ctx.closePath(); ctx.fill();
  }
 
  function drawEgg(cx, cy) {
    const { rx, ry } = eggSize();
    ctx.fillStyle = '#fdf6e9'; ctx.strokeStyle = '#b8a888'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.ellipse(cx - rx*0.3, cy - ry*0.3, rx*0.25, ry*0.18, -0.5, 0, Math.PI*2); ctx.fill();
  }
 
  function drawCracked(cx) {
    const { rx } = eggSize(); const splat = rx*4; const gY = layout.groundY;
    ctx.fillStyle = '#f5c14a';
    ctx.beginPath(); ctx.ellipse(cx, gY-4, splat, splat*0.26, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fdd870';
    ctx.beginPath(); ctx.ellipse(cx-4, gY-5, splat*0.32, splat*0.16, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fdf6e9'; ctx.strokeStyle = '#b8a888'; ctx.lineWidth = 1;
    const k = splat/30;
    [[-28,-2,6,3,0.3],[-14,-9,5,4,-0.4],[16,-8,6,3,0.6],[30,-2,5,3,-0.2],[2,-12,4,3,0],[-22,-13,4,2,0.5]]
      .forEach(p => { ctx.beginPath(); ctx.ellipse(cx+p[0]*k, gY+p[1], p[2]*k, p[3]*k, p[4], 0, Math.PI*2); ctx.fill(); ctx.stroke(); });
  }
 
  function drawGround() {
    const { W, H, groundY } = layout;
    const s = SURFACES[state.surface];
    ctx.fillStyle = s.col;
    ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = s.spec; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
 
    // surface texture — deterministic so it doesn't shimmer between frames
    ctx.fillStyle = s.spec;
    if (state.surface === 'grass') {
      for (let x = 4; x < W; x += 7) {
        const hgt = 5 + ((x * 37) % 6);
        ctx.fillRect(x, groundY - hgt, 1.5, hgt);
      }
    } else if (state.surface === 'concrete' || state.surface === 'asphalt') {
      for (let i = 0; i < 90; i++) {
        const x = (i * 79) % W, y = groundY + 6 + ((i * 53) % Math.max(1, H - groundY - 8));
        ctx.globalAlpha = 0.5; ctx.fillRect(x, y, 2, 2); ctx.globalAlpha = 1;
      }
      if (state.surface === 'concrete') {
        for (let x = W * 0.22; x < W; x += W * 0.34) {
          ctx.beginPath(); ctx.moveTo(x, groundY); ctx.lineTo(x, H); ctx.stroke();
        }
      }
    } else {
      for (let i = 0; i < 60; i++) {
        const x = (i * 91) % W, y = groundY + 5 + ((i * 47) % Math.max(1, H - groundY - 8));
        ctx.globalAlpha = 0.45; ctx.fillRect(x, y, 3, 1.5); ctx.globalAlpha = 1;
      }
    }
  }
 
  function render() {
    const { W, H, groundY, pxPerMeter } = layout;
    ctx.clearRect(0, 0, W, H);
    drawGround();
 
    ctx.strokeStyle = '#d9cdb8'; ctx.fillStyle = '#9a8e76';
    ctx.font = '12px "Spline Sans Mono", monospace'; ctx.textAlign = 'right';
    for (let m = 0; m <= 7; m++) {
      const y = groundY - m*pxPerMeter;
      ctx.beginPath(); ctx.moveTo(34, y); ctx.lineTo(44, y); ctx.stroke();
      ctx.fillText(m + ' m', 28, y+4);
    }
 
    const cx = W/2;
    const rPx = radius() * pxPerMeter * 2.6;
    const stringLen = H*0.06;
    const { ry } = eggSize();
 
    if (state.outcome === 'broken') {
      drawCracked(cx);
      const yB = groundY - 12 - rPx - state.postT*2.5*pxPerMeter;
      if (yB + rPx > -10) {
        ctx.strokeStyle = '#b3a78f'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx, yB+rPx); ctx.lineTo(cx, yB+rPx+stringLen); ctx.stroke();
        drawBalloon(cx, yB, rPx);
      }
    } else {
      const h = Math.max(0, state.h);
      const yEgg = groundY - h*pxPerMeter - ry;
      const yB = yEgg - ry - stringLen - rPx;
      ctx.strokeStyle = '#b3a78f'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, yB+rPx+4); ctx.lineTo(cx, yEgg-ry+1); ctx.stroke();
      drawBalloon(cx, yB, rPx);
      drawEgg(cx, yEgg);
    }
  }
 
  // ---------- Readouts ----------
  const $ = id => document.getElementById(id);
  const setN = (id, v, unit, dp = 2) => { $(id).textContent = v.toFixed(dp) + ' ' + unit; };
 
  function refresh() {
    const V = volL();
 
    // keep the two mass/volume views in sync
    if (state.mode === 'mass') {
      $('volSlider').value = Math.min(120, Math.max(1, V));
      $('volOutVal').textContent = V.toFixed(1) + ' L';
    } else {
      const m_app = state.m_dry - (PHYS.rho_a - rhoGas()) * volM3();
      $('finalIn').value = (m_app * 1000).toFixed(1);
      $('volOutVal').textContent = V.toFixed(1) + ' L';
    }
 
    // force balance
    setN('buoyOut', buoyancy(), 'N', 3);
    setN('wtOut',   weight(),   'N', 3);
    const L = netLift();
    $('liftOut').textContent = (L >= 0 ? '+' : '') + L.toFixed(3) + ' N';
    $('liftOut').className = 'v ' + (L > 0 ? 'up' : 'down');
    setN('netOut',  netDown(), 'N', 3);
    $('netOut').className = 'v ' + (netDown() > 0 ? 'down' : 'up');
    setN('mheOut',   massHe()   * 1000, 'g', 2);
    setN('mtrueOut', massTrue() * 1000, 'g', 2);
 
    // flight
    setN('rOut', radius() * 100, 'cm', 1);
    const vt = termV();
    $('vtOut').textContent = vt === null ? T('float_up') : vt.toFixed(2) + ' m/s';
    setN('hOut', Math.max(0, state.h), 'm', 2);
    setN('vOut', state.v, 'm/s', 2);
 
    // impact
    const landed = state.outcome === 'broken' || state.outcome === 'safe';
    const showV = landed ? state.impactV : (vt === null ? null : vt);
    const showF = landed ? state.impactF : (showV === null ? null : impactF(showV));
 
    $('ivOut').textContent = showV === null ? T('none') : showV.toFixed(2) + ' m/s';
    $('ifOut').textContent = showF === null ? T('none') : showF.toFixed(1) + ' N';
    $('strOut').textContent = state.F_fail.toFixed(1) + ' N';
 
    if (showF === null) {
      $('loadOut').textContent = T('none');
      $('loadOut').className = 'v';
      $('loadBar').style.width = '0%';
      $('vmaxOut').textContent = T('none');
    } else {
      const ratio = showF / state.F_fail;
      $('loadOut').textContent = (ratio * 100).toFixed(0) + ' %';
      $('loadOut').className = 'v ' + (ratio > 1 ? 'bad' : 'ok');
      $('loadBar').style.width = Math.min(100, ratio * 100) + '%';
      $('loadBar').style.background = ratio > 1 ? 'var(--red)' : (ratio > 0.8 ? '#d89a30' : 'var(--green)');
      setN('vmaxOut', maxSafeV(), 'm/s', 2);
    }
 
    $('ifOut').className = 'v' + (showF !== null && showF > state.F_fail ? ' bad' : (showF !== null ? ' ok' : ''));
 
    render();
  }
 
  // ---------- Language ----------
  function applyLang() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n');
      if (i18n[lang][k] !== undefined) el.innerHTML = i18n[lang][k];
    });
    const sel = $('surfSel');
    sel.innerHTML = '';
    Object.entries(SURFACES).forEach(([key, s]) => {
      const o = document.createElement('option');
      o.value = key; o.textContent = s[lang];
      if (key === state.surface) o.selected = true;
      sel.appendChild(o);
    });
    $('btnEn').classList.toggle('active', lang === 'en');
    $('btnJa').classList.toggle('active', lang === 'ja');
    if (state.outcome !== null) showStatus();
    refresh();
  }
 
  // ---------- Mode ----------
  function setMode(m) {
    state.mode = m;
    $('tabMass').classList.toggle('active', m === 'mass');
    $('tabVol').classList.toggle('active', m === 'vol');
    $('finalIn').disabled = (m === 'vol');
    $('volSlider').disabled = (m === 'mass');
    if (m === 'vol') state.volManual = volL();
    refresh();
  }
 
  // ---------- Events ----------
  const num = (el, fn) => el.addEventListener('input', e => {
    const val = parseFloat(e.target.value);
    if (isNaN(val)) return;
    fn(val);
    if (!state.running) refresh();
  });
 
  $('btnEn').addEventListener('click', () => { lang = 'en'; applyLang(); });
  $('btnJa').addEventListener('click', () => { lang = 'ja'; applyLang(); });
  $('tabMass').addEventListener('click', () => setMode('mass'));
  $('tabVol').addEventListener('click',  () => setMode('vol'));
 
  num($('dryIn'),      v => state.m_dry   = Math.max(0.001, v) / 1000);
  num($('finalIn'),    v => state.m_final = Math.max(0, v) / 1000);
  num($('purityIn'),   v => state.purity  = Math.max(0.01, Math.min(100, v)) / 100);
  num($('strengthIn'), v => state.F_fail  = Math.max(0.1, v));
  num($('volSlider'),  v => state.volManual = v);
  num($('stopIn'),     v => state.d_stop = Math.max(0.0002, v / 1000));
 
  $('surfSel').addEventListener('change', e => {
    state.surface = e.target.value;
    state.d_stop = SURFACES[state.surface].d;
    $('stopIn').value = (state.d_stop * 1000).toFixed(1);
    refresh();
  });
 
  $('heightSel').addEventListener('change', e => { state.start_h = parseFloat(e.target.value); reset(); });
  $('restartBtn').addEventListener('click', reset);
  $('dropBtn').addEventListener('click', () => {
    if (!state.running && state.outcome === null) state.running = true;
  });
  window.addEventListener('resize', () => { fit(); render(); });
 
  // ---------- Loop ----------
  let lastT = null;
  function frame(t) {
    if (lastT === null) lastT = t;
    const dt = Math.min((t - lastT) / 1000, 0.05); lastT = t;
    for (let i = 0; i < 6; i++) step(dt / 6);
    if (state.running || state.outcome !== null) refresh(); else render();
    requestAnimationFrame(frame);
  }
 
  fit();
  setMode('mass');
  applyLang();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
