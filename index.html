<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helium Balloon Egg Drop</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Noto+Sans+JP:wght@400;500&family=Noto+Serif+JP:wght@600&family=Spline+Sans+Mono:wght@400;500&display=swap');

  :root {
    --bg: #f4efe6;
    --panel: #fbf8f1;
    --ink: #2b2620;
    --ink-soft: #6f6658;
    --line: #ddd3c2;
    --accent: #d85a30;
    --accent-dark: #993c1d;
    --green: #4f7a3a;
    --blue: #3a6ea5;
    --red: #c0392b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Spline Sans Mono', 'Noto Sans JP', monospace;
    position: relative;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3vh 3vw;
    background-image: radial-gradient(circle at 20% 15%, rgba(216,90,48,0.05), transparent 45%),
                      radial-gradient(circle at 85% 80%, rgba(58,110,165,0.05), transparent 45%);
  }

  /* Language Switch */
  .lang-toggle {
    position: absolute;
    top: 24px;
    right: 24px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    display: flex;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(43,38,32,0.08);
    z-index: 100;
  }
  .lang-toggle button {
    background: transparent;
    color: var(--ink-soft);
    border: none;
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 0;
    transition: all 0.2s;
  }
  .lang-toggle button.active {
    background: var(--accent);
    color: #fff;
  }

  .wrap {
    width: 100%;
    max-width: 1180px;
    display: grid;
    grid-template-columns: 1.55fr 1fr;
    gap: clamp(16px, 2vw, 32px);
    align-items: stretch;
  }

  .stage {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 18px 50px -24px rgba(43,38,32,0.35);
    min-height: 500px;
  }

  canvas { display: block; width: 100%; height: 100%; }

  #status {
    position: absolute;
    top: 18px; left: 50%;
    transform: translateX(-50%);
    font-size: clamp(13px, 1.4vw, 16px);
    font-weight: 500;
    padding: 9px 18px;
    background: rgba(251,248,241,0.94);
    border: 1px solid var(--line);
    border-radius: 999px;
    white-space: nowrap;
    display: none;
    box-shadow: 0 6px 18px -8px rgba(43,38,32,0.4);
  }
  .s-broken { color: var(--red); }
  .s-safe   { color: var(--green); }
  .s-floated{ color: var(--blue); }

  .side {
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 1.6vw, 20px);
    min-width: 0;
  }

  .titlecard h1 {
    font-family: 'Fraunces', 'Noto Serif JP', serif;
    font-weight: 600;
    font-size: clamp(22px, 2.8vw, 34px);
    line-height: 1.15;
    letter-spacing: -0.01em;
  }
  .titlecard p {
    margin-top: 6px;
    color: var(--ink-soft);
    font-size: clamp(12px, 1.3vw, 14px);
    line-height: 1.5;
  }

  .metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .metric {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .metric .lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }
  .metric .val {
    font-family: 'Fraunces', 'Noto Serif JP', serif;
    font-size: clamp(20px, 2.4vw, 28px);
    font-weight: 600;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .controls {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: clamp(14px, 1.6vw, 20px);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  
  .ctl-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .ctl label {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  
  .ctl input[type=number], .ctl select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
  }
  .ctl input[type=number]:focus, .ctl select:focus { border-color: var(--accent); }

  /* Custom Slider Styling */
  .ctl input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 999px;
    background: var(--line);
    outline: none;
    border: none;
    padding: 0;
    margin-top: 6px;
  }
  .ctl input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--panel);
    box-shadow: 0 0 0 1px var(--accent);
    cursor: pointer;
  }
  .ctl input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--panel);
    cursor: pointer;
  }

  .actions { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    margin-top: 4px; 
  }
  .btn-group { display: flex; gap: 8px; }
  
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  button:hover { background: var(--accent-dark); }
  button:active { transform: translateY(1px); }
  
  button.btn-sec {
    background: var(--line);
    color: var(--ink);
  }
  button.btn-sec:hover { background: #d0c4ae; }

  .hint { font-size: 12px; color: var(--ink-soft); }

  @media (max-width: 820px) {
    .wrap { grid-template-columns: 1fr; }
    .stage { min-height: 52vh; }
  }
</style>
</head>
<body>

  <div class="lang-toggle">
    <button id="btnEn" class="active">EN</button>
    <button id="btnJa">日本語</button>
  </div>

  <div class="wrap">
    <div class="stage">
      <canvas id="scene" width="760" height="560"></canvas>
      <div id="status"></div>
    </div>

    <div class="side">
      <div class="titlecard">
        <h1 data-i18n="title">Helium Balloon<br>Egg Drop</h1>
        <p data-i18n="desc"></p>
      </div>

      <div class="metrics">
        <div class="metric"><div class="lbl" data-i18n="lbl_h">Height</div><div class="val" id="hOut">5.8 m</div></div>
        <div class="metric"><div class="lbl" data-i18n="lbl_v">Velocity</div><div class="val" id="vOut">0.00 m/s</div></div>
        <div class="metric"><div class="lbl" data-i18n="lbl_r">Radius</div><div class="val" id="rOut">15.0 cm</div></div>
        <div class="metric"><div class="lbl" data-i18n="lbl_vt">Terminal V</div><div class="val" id="vtOut">2.89 m/s</div></div>
      </div>

      <div class="controls">
        <div class="ctl-group">
          <div class="ctl">
            <label for="heightSel" data-i18n="lbl_sel_h">Drop height (m)</label>
            <select id="heightSel">
              <option value="5.8">5.8</option>
              <option value="3.7">3.7</option>
            </select>
          </div>
          <div class="ctl">
            <label for="purityIn" data-i18n="lbl_pur">He Purity (%)</label>
            <input id="purityIn" type="number" min="0" max="100" step="1" value="100">
          </div>
        </div>

        <div class="ctl">
          <label for="volSlider" style="display: flex; justify-content: space-between;">
            <span data-i18n="lbl_vol">Helium volume</span>
            <b id="volOutVal" style="color: var(--ink);">14.1 L</b>
          </label>
          <input id="volSlider" type="range" min="1" max="100" step="0.1" value="14.1">
        </div>
        
        <div class="ctl-group">
          <div class="ctl">
            <label for="massIn" data-i18n="lbl_mass">Total mass (g)</label>
            <input id="massIn" type="number" min="5" max="200" step="1" value="30">
          </div>
          <div class="ctl">
            <label for="breakIn" data-i18n="lbl_tol">Impact Tol (m/s)</label>
            <input id="breakIn" type="number" min="0.5" max="10" step="0.1" value="2.5">
          </div>
        </div>

        <div class="actions">
          <div class="btn-group">
            <button id="dropBtn" data-i18n="btn_drop">↓ Drop</button>
            <button id="restartBtn" class="btn-sec" data-i18n="btn_reset">↻ Reset</button>
          </div>
          <span class="hint" id="breakHint">Breaks above 2.5 m/s</span>
        </div>
      </div>
    </div>
  </div> 

<script>
(function() {
  // --- Translation Dictionary ---
  const i18n = {
    en: {
      title: "Helium Balloon<br>Egg Drop",
      desc: "",
      lbl_h: "Height", lbl_v: "Velocity", lbl_r: "Radius", lbl_vt: "Terminal V",
      lbl_sel_h: "Drop height (m)", lbl_pur: "He Purity (%)",
      lbl_vol: "Helium volume", lbl_mass: "Total mass (g)", lbl_tol: "Impact Tol (m/s)",
      btn_drop: "↓ Drop", btn_reset: "↻ Reset",
      hint: "Breaks above {v} m/s",
      s_broken: "✕ Egg broke — impact {v} m/s",
      s_safe: "✓ Safe landing — impact {v} m/s",
      s_float: "↑ Floated away",
      float_up: "floats up"
    },
    ja: {
      title: "ヘリウム風船<br>エッグドロップ",
      desc: "",
      lbl_h: "高さ", lbl_v: "速度", lbl_r: "半径", lbl_vt: "終端速度",
      lbl_sel_h: "落下高度 (m)", lbl_pur: "ヘリウム純度 (%)",
      lbl_vol: "ヘリウム体積", lbl_mass: "総質量 (g)", lbl_tol: "衝撃耐性 (m/s)",
      btn_drop: "↓ 落下", btn_reset: "↻ リセット",
      hint: "{v} m/s以上で破損",
      s_broken: "✕ 卵が割れました — 衝撃 {v} m/s",
      s_safe: "✓ 着陸成功 — 衝撃 {v} m/s",
      s_float: "↑ 飛んでいきました",
      float_up: "浮上"
    }
  };
  
  let currentLang = 'en';

  function applyLang() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(i18n[currentLang][key]) el.innerHTML = i18n[currentLang][key];
    });
    document.getElementById('breakHint').textContent = i18n[currentLang].hint.replace('{v}', state.break_v.toFixed(1));
    
    document.getElementById('btnEn').classList.toggle('active', currentLang === 'en');
    document.getElementById('btnJa').classList.toggle('active', currentLang === 'ja');
    
    if (state.outcome !== null) showStatus();
    updateMetrics();
  }

  const cvs = document.getElementById('scene');
  const ctx = cvs.getContext('2d');

  function fit() {
    const r = cvs.parentElement.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cvs.width = Math.round(r.width * dpr);
    cvs.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout.W = r.width; layout.H = r.height;
    layout.topY = r.height * 0.07;
    layout.groundY = r.height * 0.9;
    layout.pxPerMeter = (layout.groundY - layout.topY) / 7;
  }
  const layout = {};

  const PHYS = { 
    rho_a: 1.225,
    rho_h: 0.1664,   // He density at 20°C (was 0.1786 at 0°C)
    g: 9.81, 
    Cd: 0.44          // smooth sphere Re 10^4–10^5 (was 0.55)
  };
  
  const state = { 
    vol: 14.1,
    m_total: 0.030,   // total mass (egg + balloon rubber combined)
    purity: 1.0, 
    break_v: 2.5, 
    start_h: 5.8,
    h: 5.8, v: 0.0, t: 0, 
    running: false, outcome: null, impactV: 0, postT: 0 
  };

  function getRadius() {
    const v_m3 = state.vol * 0.001;
    return Math.pow((3 * v_m3) / (4 * Math.PI), 1/3);
  }

  function getGasDensity() {
    return state.purity * PHYS.rho_h + (1 - state.purity) * PHYS.rho_a;
  }

  function termV() {
    const r = getRadius();
    const V_m3 = state.vol * 0.001;
    const A = Math.PI * r * r;
    const rho_gas = getGasDensity();
    // net weight uses total mass; no separate rubber term
    const netW = PHYS.g * (state.m_total - (PHYS.rho_a - rho_gas) * V_m3);
    if (netW <= 0) return null;
    return Math.sqrt(2 * netW / (PHYS.rho_a * PHYS.Cd * A));
  }

  function reset() {
    state.h = state.start_h; state.v = 0; state.t = 0;
    state.running = false; state.outcome = null; state.impactV = 0; state.postT = 0;
    document.getElementById('status').style.display = 'none';
    updateMetrics();
    render();
  }

  function start() {
    if (!state.running && state.outcome === null) {
      state.running = true;
    }
  }

  function step(dt) {
    if (state.running) {
      const r = getRadius();
      const V_m3 = state.vol * 0.001;
      const A = Math.PI * r * r;
      const rho_gas = getGasDensity();
      
      // inertia: total mass + gas inside balloon (no separate rubber term)
      const inertia = state.m_total + rho_gas * V_m3;
      // net gravitational force: total weight minus buoyancy
      const Fg = PHYS.g * (state.m_total - (PHYS.rho_a - rho_gas) * V_m3);
      const Fd = -0.5 * PHYS.rho_a * state.v * Math.abs(state.v) * PHYS.Cd * A;
      
      state.v += ((Fg + Fd) / inertia) * dt;
      state.h -= state.v * dt;
      state.t += dt;
      
      if (state.h <= 0) {
        state.impactV = state.v; state.h = 0; state.running = false;
        state.outcome = state.v > state.break_v ? 'broken' : 'safe';
        showStatus();
      } else if (state.h > state.start_h + 3) {
        state.running = false; state.outcome = 'floated'; showStatus();
      }
    } else if (state.outcome) { 
      state.postT += dt; 
    }
  }

  function showStatus() {
    const el = document.getElementById('status');
    let msg = '';
    if (state.outcome === 'broken')      msg = `<span class="s-broken">${i18n[currentLang].s_broken.replace('{v}', state.impactV.toFixed(2))}</span>`;
    else if (state.outcome === 'safe')   msg = `<span class="s-safe">${i18n[currentLang].s_safe.replace('{v}', state.impactV.toFixed(2))}</span>`;
    else if (state.outcome === 'floated')msg = `<span class="s-floated">${i18n[currentLang].s_float}</span>`;
    
    el.innerHTML = msg;
    el.style.display = 'block';
  }

  function eggSize() { const s = Math.cbrt(state.m_total/0.030); return { rx: 9*s, ry: 13*s }; }

  function drawBalloon(cx, cy, rPx) {
    const grad = ctx.createRadialGradient(cx - rPx*0.3, cy - rPx*0.35, rPx*0.1, cx, cy, rPx);
    grad.addColorStop(0, '#ef7d54'); grad.addColorStop(1, '#d85a30');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, rPx, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#993c1d'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.ellipse(cx - rPx*0.32, cy - rPx*0.38, rPx*0.16, rPx*0.1, -0.6, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = '#993c1d';
    ctx.beginPath(); ctx.moveTo(cx-3, cy+rPx-1); ctx.lineTo(cx, cy+rPx+6); ctx.lineTo(cx+3, cy+rPx-1); ctx.closePath(); ctx.fill();
  }

  function drawEgg(cx, cy) {
    const { rx, ry } = eggSize();
    ctx.fillStyle = '#fdf6e9'; ctx.strokeStyle = '#b8a888'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.beginPath(); ctx.ellipse(cx - rx*0.3, cy - ry*0.3, rx*0.25, ry*0.18, -0.5, 0, Math.PI*2); ctx.fill();
  }

  function drawCracked(cx) {
    const { rx } = eggSize(); const splat = rx*4; const gY = layout.groundY;
    ctx.fillStyle = '#f5c14a';
    ctx.beginPath(); ctx.ellipse(cx, gY-4, splat, splat*0.26, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fdd870';
    ctx.beginPath(); ctx.ellipse(cx-4, gY-5, splat*0.32, splat*0.16, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fdf6e9'; ctx.strokeStyle = '#b8a888'; ctx.lineWidth = 1;
    const k = splat/30;
    [[-28,-2,6,3,0.3],[-14,-9,5,4,-0.4],[16,-8,6,3,0.6],[30,-2,5,3,-0.2],[2,-12,4,3,0],[-22,-13,4,2,0.5]]
      .forEach(p => { ctx.beginPath(); ctx.ellipse(cx+p[0]*k, gY+p[1], p[2]*k, p[3]*k, p[4], 0, Math.PI*2); ctx.fill(); ctx.stroke(); });
  }

  function render() {
    const { W, H, topY, groundY, pxPerMeter } = layout;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#ece5d6'; ctx.fillRect(0, groundY, W, H-groundY);
    ctx.strokeStyle = '#cdbfa6'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    
    ctx.strokeStyle = '#d9cdb8'; ctx.fillStyle = '#9a8e76'; ctx.font = '12px "Spline Sans Mono", monospace'; ctx.textAlign = 'right';
    for (let m = 0; m <= 7; m++) {
      const y = groundY - m*pxPerMeter;
      ctx.beginPath(); ctx.moveTo(34, y); ctx.lineTo(44, y); ctx.stroke();
      ctx.fillText(m + ' m', 28, y+4);
    }

    const cx = W/2;
    const rPx = getRadius() * 100 * (pxPerMeter/100) * 2.6;
    const stringLen = H*0.06;
    const { ry } = eggSize();

    if (state.outcome === 'broken') {
      drawCracked(cx);
      const yB = groundY - 12 - rPx - state.postT*2.5*pxPerMeter;
      if (yB + rPx > -10) {
        ctx.strokeStyle = '#b3a78f'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx, yB+rPx); ctx.lineTo(cx, yB+rPx+stringLen); ctx.stroke();
        drawBalloon(cx, yB, rPx);
      }
    } else {
      const h = Math.max(0, state.h);
      const yEgg = groundY - h*pxPerMeter - ry;
      const yB = yEgg - ry - stringLen - rPx;
      ctx.strokeStyle = '#b3a78f'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, yB+rPx+4); ctx.lineTo(cx, yEgg-ry+1); ctx.stroke();
      drawBalloon(cx, yB, rPx);
      drawEgg(cx, yEgg);
    }
  }

  function updateMetrics() {
    document.getElementById('hOut').textContent = Math.max(0, state.h).toFixed(1) + ' m';
    document.getElementById('vOut').textContent = state.v.toFixed(2) + ' m/s';
    document.getElementById('rOut').textContent = (getRadius()*100).toFixed(1) + ' cm';
    const vt = termV();
    document.getElementById('vtOut').textContent = vt === null ? i18n[currentLang].float_up : vt.toFixed(2) + ' m/s';
  }

  let lastT = null;
  function frame(t) {
    if (lastT === null) lastT = t;
    const dt = Math.min((t-lastT)/1000, 0.05); lastT = t;
    for (let i = 0; i < 6; i++) step(dt/6);
    render(); 
    if(state.running || state.outcome !== null) updateMetrics();
    requestAnimationFrame(frame);
  }

  // --- Controls Setup ---
  document.getElementById('btnEn').addEventListener('click', () => { currentLang = 'en'; applyLang(); });
  document.getElementById('btnJa').addEventListener('click', () => { currentLang = 'ja'; applyLang(); });

  document.getElementById('volSlider').addEventListener('input', e => {
    state.vol = parseFloat(e.target.value);
    document.getElementById('volOutVal').textContent = state.vol.toFixed(1) + ' L';
    if (!state.running) { updateMetrics(); render(); }
  });
  
  document.getElementById('massIn').addEventListener('input', e => {
    let val = parseFloat(e.target.value);
    if(isNaN(val)) return;
    state.m_total = Math.max(1, val) / 1000;
    if (!state.running) { updateMetrics(); render(); }
  });

  document.getElementById('heightSel').addEventListener('change', e => {
    state.start_h = parseFloat(e.target.value);
    reset();
  });

  document.getElementById('purityIn').addEventListener('input', e => {
    let val = parseFloat(e.target.value);
    if(isNaN(val)) return;
    state.purity = Math.max(0, Math.min(100, val)) / 100;
    if (!state.running) { updateMetrics(); render(); }
  });

  document.getElementById('breakIn').addEventListener('input', e => {
    let val = parseFloat(e.target.value);
    if(isNaN(val)) return;
    state.break_v = Math.max(0.1, val);
    document.getElementById('breakHint').textContent = i18n[currentLang].hint.replace('{v}', state.break_v.toFixed(1));
  });

  document.getElementById('restartBtn').addEventListener('click', reset);
  document.getElementById('dropBtn').addEventListener('click', start);
  window.addEventListener('resize', fit);

  fit();
